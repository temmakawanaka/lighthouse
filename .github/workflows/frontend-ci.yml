name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docs/dependency-security.md"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docs/dependency-security.md"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npm run typecheck
          - name: Test
            command: npm test
          - name: Build
            command: npm run build
          - name: HTTP integration
            command: npm run test:http-status
          - name: E2E
            command: npm run test:e2e
            playwright: true
          - name: Production dependency audit
            command: npm run audit:production
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.playwright == true
        run: npx playwright install chromium --with-deps

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload Playwright report and review images
        if: always() && matrix.playwright == true
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
